name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Select version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != 'release' ]]; then
            echo "This workflow must run from the release branch." >&2
            exit 1
          fi

          git fetch --tags --force
          existing_tag="$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          if [[ -n "$existing_tag" ]]; then
            version="$existing_tag"
          else
            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
            if [[ -z "$latest_tag" ]]; then
              version='v0.1.0'
            elif [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              version="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              echo "The latest version tag is not valid SemVer: $latest_tag" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Debian packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          for runtime in linux-x64 linux-arm64; do
            publish_dir="publish-$runtime"
            archive="artifacts/cistanas-$VERSION-$runtime.tar.gz"
            rm -rf "$publish_dir"

            dotnet publish CistaNAS.Web/CistaNAS.Web.csproj \
              --configuration Release \
              --runtime "$runtime" \
              --self-contained true \
              --output "$publish_dir" \
              -p:DebugType=None \
              -p:DebugSymbols=false

            tar -czf "$archive" -C "$publish_dir" .
            sha256sum "$archive" > "$archive.sha256"
            rm -rf "$publish_dir"
          done

      - name: Publish version tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/$VERSION"; then
            tag_sha="$(git rev-list -n 1 "$VERSION")"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag $VERSION already points to $tag_sha, not $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag --annotate "$VERSION" "$GITHUB_SHA" --message "Release $VERSION"
            git push origin "$VERSION"
          fi

          notes="$(printf 'Debian packages:\n- x86_64: `cistanas-%s-linux-x64.tar.gz`\n- arm64: `cistanas-%s-linux-arm64.tar.gz`\n\nCommit: `%s`\n' "$VERSION" "$VERSION" "$GITHUB_SHA")"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" artifacts/* --clobber
          else
            gh release create "$VERSION" artifacts/* \
              --verify-tag \
              --title "CistaNAS $VERSION" \
              --notes "$notes"
          fi
